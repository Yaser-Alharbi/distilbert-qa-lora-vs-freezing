name: Deploy demo page

on:
  push:
    branches:
      - main
    paths:
      - "demo/index.html"
      - "demo/data.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the page and its committed data; data.json is built
      # locally by `python -m demo.export_data` from gitignored predictions.
      - name: Stage site
        run: |
          mkdir _site
          cp demo/index.html demo/data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
